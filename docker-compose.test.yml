services:
  postgres:
    image: postgres:16
    container_name: akaar-prisma-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: akaar_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akaar_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - akaar_prisma_test_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  akaar_prisma_test_data:
